# Configuración del panel de contenido (Decap CMS)
# Cada cambio guardado en el panel se convierte en un commit en GitHub,
# y Cloudflare Pages publica el sitio actualizado en uno o dos minutos.

locale: es

backend:
  name: github
  repo: serviciosfcb/sefcb
  branch: main
  # Al lanzar el sitio en sefcb.co, cambiar estas direcciones y la de la app OAuth de GitHub
  base_url: https://sefcb.pages.dev
  auth_endpoint: api/auth
  commit_messages:
    create: 'Panel: crear {{collection}} "{{slug}}"'
    update: 'Panel: actualizar {{collection}} "{{slug}}"'
    delete: 'Panel: eliminar {{collection}} "{{slug}}"'
    uploadMedia: 'Panel: subir "{{path}}"'
    deleteMedia: 'Panel: eliminar "{{path}}"'

site_url: https://sefcb.pages.dev
display_url: https://sefcb.pages.dev
logo_url: /apple-touch-icon.png

media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

# Campos reutilizables (anclas de YAML)
x-campos-pagina: &campos_pagina
  - { label: Clave (no cambiar), name: key, widget: hidden }
  - { label: Sección (no cambiar), name: section, widget: hidden }
  - { label: Diseño (no cambiar), name: layout, widget: hidden, required: false }
  - { label: Orden, name: order, widget: hidden, required: false }
  - { label: Título, name: title, widget: string }
  - { label: Entradilla, name: lead, widget: text, required: false, hint: 'Una o dos frases bajo el título.' }
  - { label: Descripción para Google, name: description, widget: text, required: false, hint: 'Máximo 160 caracteres.' }
  - { label: Texto de la tarjeta, name: card, widget: string, required: false, hint: 'Frase corta que aparece en la tarjeta de esta página en su sección.' }
  - { label: Foto de cabecera, name: image, widget: image, required: false, choose_url: false, media_folder: /src/assets/fotos, public_folder: /src/assets/fotos, hint: 'Opcional. Aparece junto al título. Use fotos horizontales de al menos 1600 px de ancho, sin pacientes identificables salvo que haya autorización escrita.' }
  - { label: Descripción de la foto, name: image_alt, widget: string, required: false, hint: 'Qué se ve en la foto, en una frase (por ejemplo: Una especialista explica a una paciente su ecocardiograma). La leen las personas que usan lectores de pantalla. Obligatoria si hay foto.' }
  - { label: Encuadre de la foto, name: image_pos, widget: string, required: false, default: '50% 50%', hint: 'Qué parte se conserva cuando la foto se recorta: posición horizontal y vertical. 50% 50% es el centro; 50% 25% conserva la parte de arriba (útil si hay caras arriba).' }
  - { label: Nota interna, name: review, widget: hidden, required: false }
  - label: Contenido
    name: body
    widget: markdown
    required: false
    buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote]
    editor_components: [image]

x-campos-servicio: &campos_servicio
  - { label: Clave (no cambiar), name: key, widget: hidden }
  - { label: Orden, name: order, widget: hidden }
  - { label: Nombre del servicio, name: title, widget: string }
  - { label: Etiqueta, name: tag, widget: string, hint: 'Ej. Adultos y niños' }
  - { label: Resumen, name: summary, widget: text }
  - label: Sede donde se presta
    name: sede
    widget: select
    options: [{ label: Sede principal, value: 0 }, { label: Sede 2, value: 1 }]
  - { label: Nota de ubicación, name: location, widget: text, required: false }
  - { label: Foto del servicio, name: image, widget: image, required: false, choose_url: false, media_folder: /src/assets/fotos, public_folder: /src/assets/fotos, hint: 'Opcional. Aparece arriba de la descripción. Use fotos horizontales de al menos 1600 px de ancho, sin pacientes identificables salvo que haya autorización escrita.' }
  - { label: Descripción de la foto, name: image_alt, widget: string, required: false, hint: 'Qué se ve en la foto, en una frase (por ejemplo: Una especialista explica a una paciente su ecocardiograma). La leen las personas que usan lectores de pantalla. Obligatoria si hay foto.' }
  - { label: Pie de foto, name: image_caption, widget: string, required: false, hint: 'Frase corta bajo la foto.' }
  - { label: Encuadre de la foto, name: image_pos, widget: string, required: false, default: '50% 50%', hint: 'Qué parte se conserva cuando la foto se recorta: posición horizontal y vertical. 50% 50% es el centro; 50% 25% conserva la parte de arriba (útil si hay caras arriba).' }
  - { label: Nota interna, name: review, widget: hidden, required: false }
  - label: Procedimientos
    name: groups
    label_singular: grupo
    widget: list
    required: false
    summary: '{{fields.title}}'
    fields:
      - { label: Título del grupo, name: title, widget: string }
      - { label: Introducción, name: intro, widget: text, required: false }
      - label: Elementos
        name: items
        label_singular: elemento
        widget: list
        summary: '{{fields.name}}'
        fields:
          - { label: Nombre, name: name, widget: string }
          - { label: Explicación, name: detail, widget: text, required: false }
  - label: Descripción
    name: body
    widget: markdown
    buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list]
    editor_components: []

x-campos-educacion: &campos_educacion
  - { label: Clave, name: key, widget: string, hint: 'Una palabra sin espacios ni tildes, igual en español y en inglés (por ejemplo ecocardiograma). Une la ficha con su traducción.' }
  - { label: Título, name: title, widget: string }
  - { label: Resumen, name: summary, widget: text, hint: 'Una o dos frases. Aparece bajo el título y en la tarjeta.' }
  - label: Categoría
    name: categoria
    widget: select
    options: [{ label: Conozca su examen, value: examenes }, { label: Urgencias, value: urgencias }, { label: Enfermedades del corazón, value: enfermedades }, { label: Prevención, value: prevencion }, { label: Estilos de vida, value: estilos }, { label: Viva con su tratamiento, value: tratamiento }, { label: Seguridad del paciente, value: seguridad }, { label: Derechos y normatividad, value: derechos }, { label: Familias y cuidadores, value: familias }]
  - { label: Tipo, name: tipo, widget: select, default: lectura, options: [{ label: Lectura, value: lectura }, { label: Herramienta, value: herramienta }, { label: Video, value: video }, { label: Descargable, value: descargable }] }
  - { label: Momento de la atención, name: momento, widget: select, multiple: true, required: false, options: [{ label: Antes, value: antes }, { label: Durante, value: durante }, { label: Después, value: despues }, { label: Siempre, value: siempre }] }
  - { label: Servicios relacionados, name: servicios, widget: select, multiple: true, required: false, options: [{ label: Cardiología no invasiva, value: noinvasiva }, { label: Medicina nuclear, value: nuclear }, { label: Intervencionismo, value: intervencionismo }, { label: Consulta externa, value: consulta }, { label: Terapia física, value: terapia }, { label: Transporte asistencial, value: transporte }, { label: HORMESIS, value: obesidad }] }
  - label: Herramienta interactiva
    name: herramienta
    widget: select
    required: false
    default: ''
    hint: 'Paso a paso usa la preparación del examen y las listas de abajo. Emergencia usa las señales de alarma. Factores de riesgo usa la lista para marcar.'
    options: [{ label: Ninguna, value: '' }, { label: Su examen paso a paso, value: pasos }, { label: '¿Es una emergencia?', value: emergencia }, { label: Registro de presión arterial, value: presion }, { label: IMC y cintura, value: imc }, { label: Factores de riesgo para marcar, value: riesgo }]
  - { label: Examen (preparación), name: prep, widget: select, required: false, default: '', hint: 'La preparación oficial de este examen aparece en "Antes".', options: [{ label: 'Ninguna', value: '' }, { label: "Holter de ritmo cardíaco", value: 'holter-ritmo' }, { label: "Holter de presión arterial (MAPA)", value: 'holter-presion' }, { label: "Ecocardiograma transtorácico", value: 'eco-transtoracico' }, { label: "Ecocardiograma transesofágico", value: 'eco-transesofagico' }, { label: "Ecocardiograma de estrés y prueba de esfuerzo", value: 'eco-estres' }, { label: "Perfusión miocárdica en reposo y después del ejercicio", value: 'perfusion-esfuerzo' }, { label: "Perfusión miocárdica en reposo", value: 'perfusion-reposo' }, { label: "Ventriculografía isotópica", value: 'ventriculografia' }, { label: "Gammagrafía de tiroides", value: 'tiroides' }, { label: "Gammagrafía de glándulas paratiroides", value: 'paratiroides' }, { label: "Gammagrafía de glándulas salivales", value: 'salivales' }, { label: "Gammagrafía de reflujo gastroesofágico", value: 'reflujo' }, { label: "Gammagrafía de tránsito gastroesofágico", value: 'transito' }, { label: "Vaciamiento gástrico en fase líquida", value: 'vaciamiento-liquidos' }, { label: "Vaciamiento gástrico en fase sólida", value: 'vaciamiento-solidos' }, { label: "Gammagrafía para mucosa gástrica ectópica", value: 'mucosa-ectopica' }, { label: "Investigación de hemorragia digestiva", value: 'hemorragia' }, { label: "Gammagrafía hepatobiliar", value: 'hepatobiliar' }, { label: "Gammagrafía hepatoesplénica", value: 'hepatoesplenica' }, { label: "Gammagrafía para hemangioma (pirofosfatos)", value: 'hemangioma' }, { label: "Renograma secuencial y filtración glomerular", value: 'renograma' }, { label: "Gammagrafía renal (DMSA)", value: 'renal-dmsa' }, { label: "Cistogammagrafía", value: 'cistogammagrafia' }, { label: "Gammagrafía de contenido escrotal (perfusión testicular)", value: 'testicular' }, { label: "Gammagrafía ósea", value: 'osea' }, { label: "Gammagrafía pulmonar de perfusión y ventilación", value: 'pulmonar-pv' }, { label: "Gammagrafía pulmonar de perfusión", value: 'pulmonar-p' }, { label: "SPECT cerebral", value: 'spect-cerebral' }, { label: "Cisternografía isotópica", value: 'cisternografia' }, { label: "Dacriocistogammagrafía", value: 'dacriocistografia' }, { label: "Gammagrafía de ganglios linfáticos (linfogammagrafía)", value: 'ganglios' }, { label: "Terapia con radio 223", value: 'radio-223' }] }
  - label: Paso a paso
    name: pasos
    widget: object
    required: false
    collapsed: true
    fields:
      - { label: Antes (además de la preparación), name: antes, widget: list, required: false, field: { label: Paso, name: paso, widget: text } }
      - { label: Durante, name: durante, widget: list, required: false, field: { label: Paso, name: paso, widget: text } }
      - { label: Después, name: despues, widget: list, required: false, field: { label: Paso, name: paso, widget: text } }
  - label: Señales de alarma
    name: alarma
    widget: object
    required: false
    collapsed: true
    fields:
      - { label: Título, name: titulo, widget: string, required: false }
      - { label: Señales, name: items, widget: list, required: false, field: { label: Señal, name: item, widget: text } }
  - label: Lista para marcar (factores de riesgo)
    name: lista
    widget: object
    required: false
    collapsed: true
    fields:
      - { label: Título, name: titulo, widget: string, required: false }
      - { label: Elementos, name: items, widget: list, required: false, field: { label: Elemento, name: item, widget: text } }
  - { label: Preguntas para su médico, name: preguntas, widget: list, required: false, field: { label: Pregunta, name: pregunta, widget: string } }
  - label: Comprobación
    name: comprobacion
    widget: object
    required: false
    collapsed: true
    fields:
      - { label: Pregunta, name: pregunta, widget: string, required: false }
      - { label: Opciones, name: opciones, widget: list, required: false, field: { label: Opción, name: opcion, widget: string } }
      - { label: Opción correcta, name: correcta, widget: number, value_type: int, default: 0, hint: '0 es la primera opción, 1 la segunda, 2 la tercera.' }
      - { label: Explicación, name: explicacion, widget: text, required: false }
  - { label: Video de YouTube, name: video, widget: string, required: false, hint: 'Pegue el enlace del video (https://www.youtube.com/watch?v=...).' }
  - { label: Descargable (PDF), name: descargable, widget: file, required: false }
  - { label: Revisado por, name: revisado_por, widget: string, required: false, hint: 'Nombre y cargo del profesional que validó la ficha. Sin esto, no se publique contenido clínico.' }
  - { label: Fecha de revisión, name: fecha_revision, widget: datetime, required: false, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
  - { label: Próxima revisión, name: proxima_revision, widget: datetime, required: false, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
  - { label: Fuentes, name: fuentes, widget: list, required: false, summary: '{{fields.texto}}', fields: [{ label: Texto, name: texto, widget: string }, { label: Enlace, name: url, widget: string, required: false }] }
  - { label: Orden dentro de su categoría, name: orden, widget: number, value_type: int, default: 50 }
  - { label: Destacada, name: destacado, widget: boolean, default: false, required: false }
  - { label: Borrador (no publicar todavía), name: draft, widget: boolean, default: false, required: false }
  - { label: Nota interna, name: review, widget: hidden, required: false }
  - label: Texto
    name: body
    widget: markdown
    buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list]
    editor_components: []

collections:
  - name: noticias
    label: Noticias
    label_singular: noticia
    description: Novedades, campañas y avisos para pacientes. Aparecen en la página de inicio y en la sección Noticias.
    folder: src/content/noticias
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: "{{title}} · {{date | date('DD/MM/YYYY')}}"
    sortable_fields: ['date', 'title']
    view_filters:
      - label: Borradores
        field: draft
        pattern: true
    editor:
      preview: false
    fields:
      - label: Título
        name: title
        widget: string
      - label: Fecha de publicación
        name: date
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'DD/MM/YYYY'
        time_format: false
        picker_utc: true
      - label: No mostrar la fecha
        name: ocultar_fecha
        widget: boolean
        required: false
        default: false
        hint: Actívelo para avisos permanentes. La fecha se sigue usando para ordenar las noticias.
      - label: Resumen
        name: summary
        widget: text
        hint: Una o dos frases. Se muestra en el listado y en los resultados de Google.
      - label: Foto
        name: image
        widget: image
        required: false
        choose_url: false
        hint: Opcional. Use fotos propias y horizontales, de al menos 1600 px de ancho.
      - label: Descripción de la foto
        name: imageAlt
        widget: string
        required: false
        hint: Qué se ve en la foto, para personas con discapacidad visual. Ej. "Equipo de enfermería en la sala de hemodinamia".
      - label: Contenido
        name: body
        widget: markdown
        buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote]
        editor_components: [image]
      - label: Título en inglés
        name: title_en
        widget: string
        required: false
        hint: Opcional. Si lo deja vacío, la versión en inglés del sitio muestra la noticia en español.
      - label: Resumen en inglés
        name: summary_en
        widget: text
        required: false
      - label: Descripción de la foto en inglés
        name: imageAlt_en
        widget: string
        required: false
      - label: Contenido en inglés
        name: body_en
        widget: markdown
        required: false
        buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote]
        editor_components: []
      - label: Guardar como borrador (no publicar todavía)
        name: draft
        widget: boolean
        default: false

  - name: educacion-es
    label: Educación al paciente (español)
    label_singular: ficha
    description: Fichas del centro de educación al paciente. Cada ficha debe tener su versión en inglés con la misma clave. Nada clínico se publica sin la validación del área asistencial.
    folder: src/content/educacion/es
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [title, categoria, orden]
    editor:
      preview: false
    fields: *campos_educacion

  - name: educacion-en
    label: Educación al paciente (inglés)
    label_singular: ficha
    description: English versions of the patient education pages. Use the same key as the Spanish version.
    folder: src/content/educacion/en
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [title, categoria, orden]
    editor:
      preview: false
    fields: *campos_educacion

  - name: datos
    label: Datos del sitio
    description: Teléfonos, sedes, horarios, convenios y documentos de transparencia.
    editor:
      preview: false
    files:
      - name: contacto
        label: Contacto, sedes y horarios
        file: src/data/contacto.json
        fields:
          - label: Teléfonos
            name: telefonos
            widget: object
            collapsed: false
            hint: Escríbalos como deben verse en el sitio.
            fields:
              - { label: Central de citas y WhatsApp, name: citas, widget: string }
              - { label: Línea de atención 1, name: atencion1, widget: string }
              - { label: Línea de atención 2, name: atencion2, widget: string }
              - { label: PBX, name: pbx, widget: string }
              - { label: Línea ética y de transparencia, name: etica, widget: string }
          - label: Número de WhatsApp
            name: whatsapp
            widget: string
            hint: Solo números, empezando por 57. Ej. 573209362904
            pattern: ['^57[0-9]{10}$', 'Escriba 57 seguido de los 10 dígitos, sin espacios ni signos.']
          - label: Correos
            name: correos
            widget: object
            collapsed: false
            fields:
              - { label: Línea ética y de transparencia, name: etica, widget: string }
              - { label: Notificaciones judiciales, name: judicial, widget: string }
          - label: Sedes
            name: sedes
            label_singular: sede
            widget: list
            summary: '{{fields.nombre}}'
            fields:
              - { label: Nombre, name: nombre, widget: string }
              - { label: Nombre en inglés, name: nombre_en, widget: string }
              - { label: Dirección, name: direccion, widget: string }
              - { label: Dirección en inglés, name: direccion_en, widget: string }
              - { label: Servicios en esta sede, name: nota, widget: string }
              - { label: 'Servicios en esta sede (inglés)', name: nota_en, widget: string }
              - { label: Enlace de Google Maps, name: mapa, widget: string }
              - label: Horarios
                name: horarios
                label_singular: horario
                widget: list
                required: false
                summary: '{{fields.dias}}: {{fields.horas}}'
                fields:
                  - { label: Días, name: dias, widget: string, hint: 'Ej. Lunes a viernes' }
                  - { label: Días en inglés, name: dias_en, widget: string, hint: 'Ej. Monday to Friday' }
                  - { label: Horario, name: horas, widget: string, hint: 'Ej. 7:00 a. m. – 5:00 p. m.' }
                  - { label: Horario en inglés, name: horas_en, widget: string, required: false, hint: 'Ej. 7:00 a.m. – 5:00 p.m.' }

      - name: convenios
        label: Convenios
        file: src/data/convenios.json
        fields:
          - label: Entidades con convenio
            name: lista
            label_singular: entidad
            widget: list
            field: { label: Nombre, name: nombre, widget: string }

      - name: equipo
        label: Equipo y directorio
        file: src/data/equipo.json
        fields:
          - label: Directorio institucional
            name: directorio
            label_singular: persona
            widget: list
            summary: '{{fields.cargo}}: {{fields.nombre}}'
            fields:
              - label: Área
                name: area
                widget: select
                options: [{ label: Dirección, value: direccion }, { label: Administrativa, value: administrativo }, { label: Asistencial, value: asistencial }]
              - { label: Cargo, name: cargo, widget: string }
              - { label: Cargo en inglés, name: cargo_en, widget: string }
              - { label: Nombre, name: nombre, widget: string, required: false }
              - { label: Correo, name: correo, widget: string, required: false }
              - { label: Extensión, name: extension, widget: string, required: false }
              - { label: Celular, name: celular, widget: string, required: false }
              - { label: Foto, name: foto, widget: image, required: false, hint: 'Foto vertical, idealmente con el fondo quitado (PNG o WebP).' }
              - label: Sede
                name: sede
                widget: select
                options: [{ label: Sede principal, value: 0 }, { label: Sede 2, value: 1 }]
          - label: Médicos especialistas
            name: especialistas
            label_singular: área
            widget: list
            summary: '{{fields.area}}'
            fields:
              - { label: Área, name: area, widget: string }
              - { label: Área en inglés, name: area_en, widget: string }
              - label: Especialistas
                name: personas
                label_singular: especialista
                widget: list
                summary: '{{fields.titulo}} {{fields.nombre}}'
                fields:
                  - { label: Título, name: titulo, widget: select, options: ['Dr.', 'Dra.', 'Psic.', 'Nut.', 'Ft.', 'Enf.'], required: false }
                  - { label: Nombre completo, name: nombre, widget: string }
                  - { label: Especialidad, name: especialidad, widget: string, required: false }
                  - { label: Especialidad en inglés, name: especialidad_en, widget: string, required: false }
                  - { label: Foto, name: foto, widget: image, required: false, hint: 'Foto vertical (4:5), idealmente con el fondo quitado. Si no hay foto se muestran las iniciales.' }

      - name: transparencia
        label: Transparencia
        file: src/data/transparencia.json
        fields:
          - label: Estados financieros
            name: estados_financieros
            label_singular: año
            widget: list
            summary: '{{fields.anio}}'
            hint: Ponga primero el año más reciente.
            fields:
              - { label: Año, name: anio, widget: string }
              - { label: Archivo PDF, enlace o página, name: archivo, widget: file, choose_url: true, hint: 'Suba un PDF, pegue un enlace, o escriba el nombre de una página del sitio (por ejemplo politicas o datos).' }
          - label: Otros documentos
            name: documentos
            label_singular: documento
            widget: list
            summary: '{{fields.titulo}}'
            fields:
              - { label: Título, name: titulo, widget: string }
              - { label: Título en inglés, name: titulo_en, widget: string }
              - { label: Archivo PDF, enlace o página, name: archivo, widget: file, choose_url: true, hint: 'Suba un PDF, pegue un enlace, o escriba el nombre de una página del sitio (por ejemplo politicas o datos).' }

          - label: Categorías de la Ley 1712 (página de transparencia)
            name: secciones
            label_singular: categoría
            widget: list
            summary: '{{fields.titulo}}'
            fields:
              - { label: Categoría, name: titulo, widget: string }
              - { label: Categoría en inglés, name: titulo_en, widget: string }
              - { label: Mostrar aquí los estados financieros, name: estados, widget: boolean, required: false, default: false }
              - label: Elementos
                name: items
                label_singular: elemento
                widget: list
                summary: '{{fields.titulo}}'
                fields:
                  - { label: Título, name: titulo, widget: string }
                  - { label: Título en inglés, name: titulo_en, widget: string }
                  - label: Página del sitio
                    name: ruta
                    widget: select
                    required: false
                    hint: Elija una página del sitio, o deje vacío y use el campo de archivo.
                    options: ['inicio', 'noticias', 'servicios', 'pacientes', 'cita', 'antes', 'preparacion', 'resultados', 'seguridad', 'derechos', 'internacional', 'faq', 'asociacion', 'educacion', 'visitantes', 'nosotros', 'direccionamiento', 'calidad', 'equipo', 'empleo', 'bienestar', 'transparencia', 'politicas', 'entidades', 'tributarios', 'contacto', 'datos', 'accesibilidad', 'mapa']
                  - { label: Archivo PDF o enlace, name: archivo, widget: file, required: false, choose_url: true, hint: 'Escriba PQRS para enlazar el formulario de PQRS.' }
      - name: vacantes
        label: Ofertas de empleo
        file: src/data/vacantes.json
        description: Ofertas que se muestran en "Trabaje con nosotros". Para cerrar una oferta, bórrela de la lista.
