          - { label: Formulario de practicantes, name: formulario_practicas, widget: string }
          - label: Ofertas vigentes
            name: vacantes
            label_singular: oferta
            widget: list
            summary: '{{fields.cargo}}'
            fields:
              - { label: Cargo, name: cargo, widget: string }
              - { label: Cargo en inglés, name: cargo_en, widget: string }
              - { label: Área, name: area, widget: string, required: false }
              - { label: Área en inglés, name: area_en, widget: string, required: false }
              - { label: Fecha de publicación, name: fecha, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
              - { label: Asunto del correo, name: asunto, widget: string, hint: 'Ej. Vacante - Auxiliar administrativo' }
              - { label: Perfil, name: perfil, widget: list, summary: '{{fields.es}}', fields: [{ label: Texto, name: es, widget: string }, { label: Texto en inglés, name: en, widget: string }] }
              - { label: Habilidades y competencias, name: habilidades, widget: list, required: false, summary: '{{fields.es}}', fields: [{ label: Texto, name: es, widget: string }, { label: Texto en inglés, name: en, widget: string }] }
              - { label: Responsabilidades, name: responsabilidades, widget: list, required: false, summary: '{{fields.es}}', fields: [{ label: Texto, name: es, widget: string }, { label: Texto en inglés, name: en, widget: string }] }
      - name: internacional
        label: Pacientes internacionales
        file: src/data/internacional.json
        description: Ruta de atención, documentos, ingreso a Colombia, datos de Cúcuta y contacto de la página "Pacientes internacionales".
        fields:
          - label: Contacto
            name: contacto
            widget: object
            fields:
              - { label: WhatsApp (solo números, con 57), name: whatsapp, widget: string }
              - { label: WhatsApp como se muestra, name: whatsapp_label, widget: string }
              - { label: Correo, name: correo, widget: string }
              - { label: Teléfono, name: telefono, widget: string }
              - { label: Asunto sugerido, name: asunto, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
              - { label: Nota sobre idiomas, name: idioma, widget: object, fields: [{ label: Español, name: es, widget: text }, { label: Inglés, name: en, widget: text }] }
              - { label: Medios de pago, name: pagos, widget: object, fields: [{ label: Español, name: es, widget: text }, { label: Inglés, name: en, widget: text }] }
          - label: Pasos de la ruta
            name: pasos
            label_singular: paso
            widget: list
            summary: '{{fields.titulo.es}}'
            fields:
              - { label: Icono, name: icono, widget: select, options: [chat, prep, plane, heartbeat, results, passport, globe, phone, mail] }
              - { label: Título, name: titulo, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
              - { label: Texto, name: texto, widget: object, fields: [{ label: Español, name: es, widget: text }, { label: Inglés, name: en, widget: text }] }
          - label: Durante la estadía
            name: estadia
            widget: object
            fields:
              - { label: Título, name: titulo, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
              - { label: Servicios, name: items, widget: list, summary: '{{fields.titulo.es}}', fields: [{ label: Icono, name: icono, widget: select, options: [bed, car, chat, plane, globe, phone] }, { label: Título, name: titulo, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }, { label: Texto, name: texto, widget: object, fields: [{ label: Español, name: es, widget: text }, { label: Inglés, name: en, widget: text }] }] }
          - { label: Documentos que debe traer, name: documentos, widget: list, summary: '{{fields.es}}', fields: [{ label: Español, name: es, widget: text }, { label: Inglés, name: en, widget: text }] }
          - label: Ingreso a Colombia
            name: ingreso
            widget: object
            fields:
              - { label: Texto, name: texto, widget: object, fields: [{ label: Español, name: es, widget: text }, { label: Inglés, name: en, widget: text }] }
              - { label: Enlaces oficiales, name: enlaces, widget: list, summary: '{{fields.texto.es}}', fields: [{ label: Texto, name: texto, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }, { label: Dirección, name: url, widget: string }] }
          - { label: Datos de Cúcuta, name: datos, widget: list, summary: '{{fields.etiqueta.es}}', fields: [{ label: Dato, name: etiqueta, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }, { label: Valor, name: valor, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }] }
      - name: educacion
        label: Centro de educación (textos)
        file: src/data/educacion.json
        description: Categorías, situaciones de entrada, páginas enlazadas, aviso de emergencia y programa de educación de la página "Educación al paciente".
        fields:
          - label: Categorías
            name: categorias
            widget: list
            summary: '{{fields.nombre.es}}'
            fields:
              - { label: Identificador (no cambiar), name: id, widget: string }
              - { label: Ícono, name: icono, widget: string }
              - { label: Nombre, name: nombre, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
              - { label: Texto, name: texto, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
          - label: '¿Qué necesita hoy?'
            name: situaciones
            widget: list
            summary: '{{fields.titulo.es}}'
            fields:
              - { label: Ícono, name: icono, widget: string }
              - { label: Texto del botón, name: titulo, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
              - { label: Categorías que muestra, name: categorias, widget: select, multiple: true, options: [examenes, urgencias, enfermedades, prevencion, estilos, tratamiento, seguridad, derechos, familias] }
          - label: Páginas del sitio que se muestran como temas
            name: enlaces
            widget: list
            summary: '{{fields.titulo.es}}'
            fields:
              - { label: Página, name: ruta, widget: string, hint: 'Clave de la página (por ejemplo preparacion, seguridad, derechos, resultados o servicio-obesidad).' }
              - { label: Categoría, name: categoria, widget: select, options: [examenes, urgencias, enfermedades, prevencion, estilos, tratamiento, seguridad, derechos, familias] }
              - { label: Título, name: titulo, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
              - { label: Texto, name: texto, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
          - label: Aviso de emergencia
            name: emergencia
            widget: object
            fields:
              - { label: Teléfono, name: telefono, widget: string }
              - { label: Texto, name: texto, widget: object, fields: [{ label: Español, name: es, widget: text }, { label: Inglés, name: en, widget: text }] }
          - label: Programa de educación
            name: programa
            widget: object
            fields:
              - { label: Título, name: titulo, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
              - { label: Texto, name: texto, widget: object, fields: [{ label: Español, name: es, widget: text }, { label: Inglés, name: en, widget: text }] }
              - { label: Política, name: politica, widget: object, fields: [{ label: Español, name: es, widget: text }, { label: Inglés, name: en, widget: text }] }
              - { label: Fuente de la política, name: politica_fuente, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
              - { label: Actividades, name: actividades, widget: list, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
      - name: glosario
        label: Glosario de educación
        file: src/data/glosario.json
        description: Palabras que se explican al tocarlas en las fichas de educación y en la página de Educación.
        fields:
          - { label: Nota (no se publica), name: nota, widget: text, required: false }
          - label: Términos
            name: terminos
            widget: list
            summary: '{{fields.es.termino}}'
            fields:
              - { label: Español, name: es, widget: object, fields: [{ label: Término, name: termino, widget: string }, { label: Formas que se reconocen en el texto, name: formas, widget: list, field: { label: Forma, name: forma, widget: string } }, { label: Definición, name: definicion, widget: text }] }
              - { label: Inglés, name: en, widget: object, fields: [{ label: Término, name: termino, widget: string }, { label: Formas que se reconocen en el texto, name: formas, widget: list, field: { label: Forma, name: forma, widget: string } }, { label: Definición, name: definicion, widget: text }] }
      - name: galeria
        label: Fotos del inicio
        file: src/data/galeria.json
        description: Bloque "Así le atendemos" de la página de inicio. La primera foto sale en grande. Muestra hasta cinco fotos; use fotos con autorización escrita de las personas que aparecen.
        fields:
          - { label: Título, name: titulo, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
          - { label: Texto, name: texto, widget: object, fields: [{ label: Español, name: es, widget: text }, { label: Inglés, name: en, widget: text }] }
          - label: Fotos
            name: fotos
            label_singular: foto
            widget: list
            max: 5
            summary: '{{fields.pie.es}}'
            fields:
              - { label: Foto, name: src, widget: image, choose_url: false, media_folder: /src/assets/fotos, public_folder: /src/assets/fotos, hint: 'Al menos 1600 px de ancho.' }
              - { label: Rótulo sobre la foto, name: pie, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
              - { label: Descripción de la foto (para lectores de pantalla), name: alt, widget: object, fields: [{ label: Español, name: es, widget: text }, { label: Inglés, name: en, widget: text }] }
              - { label: Encuadre, name: pos, widget: string, required: false, default: '50% 50%', hint: 'Posición horizontal y vertical que se conserva al recortar. 50% 50% es el centro.' }
      - name: indicadores
        label: Indicadores del año
        file: src/data/indicadores.json
        description: Cifras de las páginas "Calidad y reconocimientos" y "Seguridad del paciente". Tómelas solo del informe de gestión aprobado del año.
        fields:
          - { label: Año, name: anio, widget: string }
          - { label: Fuente, name: fuente, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
          - { label: Enlace a la fuente, name: enlace, widget: string, hint: 'Enlace público del informe de gestión.' }
          - label: Grupos
            name: grupos
            label_singular: grupo
            widget: list
            summary: '{{fields.titulo.es}}'
            fields:
              - { label: Identificador (no cambiar), name: id, widget: string, hint: 'experiencia, seguridad o actividad. La página de seguridad del paciente muestra el grupo "seguridad".' }
              - { label: Título, name: titulo, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
              - label: Cifras
                name: items
                label_singular: cifra
                widget: list
                summary: '{{fields.etiqueta.es}}: {{fields.valor}}{{fields.unidad}}'
                fields:
                  - { label: Valor, name: valor, widget: number, value_type: float, hint: 'Con punto decimal, por ejemplo 95.86. El sitio lo muestra con coma.' }
                  - { label: Decimales que se muestran, name: decimales, widget: number, value_type: int, default: 2 }
                  - { label: Unidad, name: unidad, widget: select, options: ['%', ''], default: '%', required: false }
                  - { label: Nombre de la cifra, name: etiqueta, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
                  - { label: Detalle, name: detalle, widget: object, fields: [{ label: Español, name: es, widget: text }, { label: Inglés, name: en, widget: text }] }
      - name: seguridad
        label: Seguridad del paciente
        file: src/data/seguridad.json
        description: Metas y recomendaciones de la página "Seguridad del paciente". Cada cambio debe estar aprobado por el referente de seguridad del paciente.
        fields:
          - { label: Fuente (no se publica), name: fuente, widget: text, required: false }
          - label: Metas de seguridad
            name: metas
            label_singular: meta
            widget: list
            summary: '{{fields.titulo.es}}'
            fields:
              - { label: Icono, name: icono, widget: select, options: [idcard, chat, pill, target, hands, steps, shield, results, heartbeat] }
              - { label: Título, name: titulo, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
              - { label: Texto, name: texto, widget: object, fields: [{ label: Español, name: es, widget: text }, { label: Inglés, name: en, widget: text }] }
          - label: Recomendaciones
            name: consejos
            label_singular: grupo de recomendaciones
            widget: list
            summary: '{{fields.titulo.es}}'
            fields:
              - { label: Icono, name: icono, widget: select, options: [idcard, chat, pill, target, hands, steps, shield, results, heartbeat] }
              - { label: Título, name: titulo, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
              - { label: Recomendaciones, name: items, widget: list, summary: '{{fields.es}}', fields: [{ label: Texto, name: es, widget: text }, { label: Texto en inglés, name: en, widget: text }] }
              - label: Enlace (opcional)
                name: enlace
                widget: object
                required: false
                collapsed: true
                fields:
                  - { label: Página, name: ruta, widget: select, options: ['preparacion', 'antes', 'resultados', 'derechos', 'cita', 'contacto'] }
                  - { label: Texto del enlace, name: texto, widget: object, fields: [{ label: Español, name: es, widget: string }, { label: Inglés, name: en, widget: string }] }
      - name: preparaciones
        label: Preparación de exámenes
        file: src/data/preparaciones.json
        description: Indicaciones de preparación que se muestran en la página "Preparación para sus exámenes". Cada cambio debe estar aprobado por el área asistencial.
        fields:
          - label: Indicaciones comunes
            name: comunes
            widget: object
            collapsed: true
            fields:
              - label: Cardiología no invasiva
                name: cardiologia
                widget: object
                fields:
                  - { label: Lleve, name: llevar, widget: list, summary: '{{fields.es}}', fields: [{ label: Texto, name: es, widget: text }, { label: Texto en inglés, name: en, widget: text }] }
                  - { label: Tenga en cuenta, name: tener_en_cuenta, widget: list, summary: '{{fields.es}}', fields: [{ label: Texto, name: es, widget: text }, { label: Texto en inglés, name: en, widget: text }] }
              - label: Medicina nuclear
                name: nuclear
                widget: object
                fields:
                  - { label: Lleve, name: llevar, widget: list, summary: '{{fields.es}}', fields: [{ label: Texto, name: es, widget: text }, { label: Texto en inglés, name: en, widget: text }] }
                  - { label: Tenga en cuenta, name: tener_en_cuenta, widget: list, summary: '{{fields.es}}', fields: [{ label: Texto, name: es, widget: text }, { label: Texto en inglés, name: en, widget: text }] }
                  - { label: Después de la inyección, name: despues, widget: list, summary: '{{fields.es}}', fields: [{ label: Texto, name: es, widget: text }, { label: Texto en inglés, name: en, widget: text }] }
          - label: Exámenes
            name: examenes
            label_singular: examen
            widget: list
            summary: '{{fields.nombre}}'
            fields:
              - { label: Identificador (sin espacios ni tildes), name: id, widget: string, hint: 'Se usa en la dirección para enlazar directo al examen, por ejemplo tiroides.' }
              - { label: Servicio, name: servicio, widget: select, options: [{ label: Cardiología no invasiva, value: cardiologia }, { label: Medicina nuclear, value: nuclear }] }
              - { label: Código del documento, name: codigo, widget: string, required: false }
              - { label: Nombre del examen, name: nombre, widget: string }
              - { label: Nombre en inglés, name: nombre_en, widget: string }
              - { label: Ayuno, name: ayuno, widget: string, required: false, hint: 'Por ejemplo "6 horas" o "No requiere ayuno". Vacío si el documento no lo indica.' }
              - { label: Ayuno en inglés, name: ayuno_en, widget: string, required: false }
              - { label: Tiempo que debe disponer, name: duracion, widget: string, required: false }
              - { label: Tiempo en inglés, name: duracion_en, widget: string, required: false }
              - { label: Indicaciones, name: indicaciones, widget: list, required: false, summary: '{{fields.es}}', fields: [{ label: Texto, name: es, widget: text }, { label: Texto en inglés, name: en, widget: text }] }

